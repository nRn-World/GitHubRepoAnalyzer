<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GitHubRepoAnalyzer</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup">
    <header class="popup__header">
      <span class="popup__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <!-- Dog; so the mark is ours, not the GitHub octocat.
               Icon: "dog" from Material Design Icons (Templarian/MaterialDesign),
               Apache License 2.0. -->
          <path d="M18,4C16.29,4 15.25,4.33 14.65,4.61C13.88,4.23 13,4 12,4C11,4 10.12,4.23 9.35,4.61C8.75,4.33 7.71,4 6,4C3,4 1,12 1,14C1,14.83 2.32,15.59 4.14,15.9C4.78,18.14 7.8,19.85 11.5,20V15.72C10.91,15.35 10,14.68 10,14C10,13 12,13 12,13C12,13 14,13 14,14C14,14.68 13.09,15.35 12.5,15.72V20C16.2,19.85 19.22,18.14 19.86,15.9C21.68,15.59 23,14.83 23,14C23,12 21,4 18,4M4.15,13.87C3.65,13.75 3.26,13.61 3,13.5C3.25,10.73 5.2,6.4 6.05,6C6.59,6 7,6.06 7.37,6.11C5.27,8.42 4.44,12.04 4.15,13.87M9,12A1,1 0 0,1 8,11C8,10.46 8.45,10 9,10A1,1 0 0,1 10,11C10,11.56 9.55,12 9,12M15,12A1,1 0 0,1 14,11C14,10.46 14.45,10 15,10A1,1 0 0,1 16,11C16,11.56 15.55,12 15,12M19.85,13.87C19.56,12.04 18.73,8.42 16.63,6.11C17,6.06 17.41,6 17.95,6C18.8,6.4 20.75,10.73 21,13.5C20.75,13.61 20.36,13.75 19.85,13.87Z"/>
        </svg>
      </span>
      <h1 class="popup__title">GitHubRepoAnalyzer</h1>

      <select id="lang-select" class="popup__lang" data-i18n-aria="langLabel"></select>
      <span class="popup__badge" id="badge">local</span>
    </header>

    <!-- State: not a GitHub repo page -->
    <section id="error-state" class="state state--error" hidden>
      <p class="state__emoji" aria-hidden="true">🔍</p>
      <p class="state__heading" data-i18n="errorHeading">This isn't a GitHub repository page.</p>
      <p class="state__detail" id="error-detail" data-i18n="errorDetailNotRepo"></p>
    </section>

    <!-- State: ready to analyze -->
    <section id="ready-state" class="state">
      <p class="state__hint" data-i18n="idleHint"></p>
      <button id="analyze-btn" class="btn" type="button" data-i18n="analyzeBtn">Analyze this project</button>
    </section>

    <!-- State: analyzing -->
    <section id="loading-state" class="state state--loading" hidden>
      <span class="spinner" aria-hidden="true"></span>
      <p id="loading-text" data-i18n="loading">Reading the page…</p>
    </section>

    <!-- State: results -->
  <section id="result-state" class="state state--result" hidden>
      <h2 id="repo-name" class="result__name"></h2>
      <p id="repo-owner" class="result__owner"></p>

      <!-- Diagnosis first, not last. The result list scrolls, so a status line
           at the bottom is invisible in a screenshot; which is exactly how a
           translation failure can go unreported. The diagnostic line is always
           rendered: build + source/target + route, so any screenshot proves
           which code ran and what it decided. -->
      <p id="translation-diag" class="result__diag"></p>
      <p id="translation-status" class="result__status" hidden></p>

      <!-- In short: what the project is for, in the reader's language -->
      <div class="result__block result__block--short" id="short-block">
        <h3 class="result__label" data-i18n="labelInShort">In short</h3>
        <p id="repo-short" class="result__short"></p>
      </div>

      <!-- The author's own explanation of what this is. Kept in the short
           view on purpose: it answers "what is this", which is the question
           a reader arrives with. Everything else waits behind the button. -->
      <div class="result__block">
        <h3 class="result__label" data-i18n="labelReadme">What it is</h3>
        <p id="repo-tagline" class="result__tagline"></p>
        <p id="repo-summary" class="result__summary"></p>
        <p id="repo-readme" class="result__readme"></p>
      </div>

      <button id="deep-btn" class="btn" type="button" data-i18n="deepBtn">Deep analysis</button>

      <!-- Deep analysis: everything that is useful, but not needed to know
           what the project is. Hidden until asked for. -->
      <div id="deep-block" hidden>
        <div class="result__block">
          <h3 class="result__label" data-i18n="labelAbout">About</h3>
          <p id="repo-description" class="result__desc"></p>
        </div>

        <div class="result__block" id="topics-block">
          <h3 class="result__label" data-i18n="labelTopics">Topics</h3>
          <div id="repo-topics" class="chips"></div>
        </div>

        <div class="result__block" id="points-block">
          <h3 class="result__label" data-i18n="labelPoints">Key points</h3>
          <ul id="repo-points" class="digest__bullets"></ul>
        </div>

        <div class="result__block" id="facts-block">
          <div id="repo-facts" class="facts"></div>
        </div>
      </div>

      <button id="copy-ai-btn" class="btn btn--ghost btn--ai" type="button" data-i18n="copyAiBtn">Ask your AI about this project</button>
      <button id="analyze-again-btn" class="btn btn--ghost" type="button" data-i18n="analyzeAgain">Analyze again</button>
    </section>
  </main>

  <script src="i18n.js"></script>
  <script src="glossary.js"></script>
  <script src="popup.js"></script>
</body>
</html>
